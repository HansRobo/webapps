<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>LiDARカタログ - センサ比較データベース</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XMQZP3GPCC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-XMQZP3GPCC");
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top-app-bar">
      <div class="top-app-bar__content">
        <a href="../../index.html" class="top-app-bar__back" aria-label="ダッシュボードへ戻る">
          <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <span class="material-symbols-outlined top-app-bar__icon">sensors</span>
        <div class="top-app-bar__title-wrap">
          <h1 class="top-app-bar__title">LiDARカタログ</h1>
          <p class="top-app-bar__subtitle">センサ比較データベース（一次情報付き）</p>
        </div>
      </div>
      <nav class="main-nav" id="mainNav" aria-label="メインナビゲーション">
        <a href="#/products" class="nav-tab" data-view="products">
          <span class="material-symbols-outlined">sensors</span>
          <span class="nav-tab__label">製品</span>
        </a>
        <a href="#/manufacturers" class="nav-tab" data-view="manufacturers">
          <span class="material-symbols-outlined">business</span>
          <span class="nav-tab__label">メーカー</span>
        </a>
        <a href="#/scan-methods" class="nav-tab" data-view="scan-methods">
          <span class="material-symbols-outlined">radar</span>
          <span class="nav-tab__label">走査方式</span>
        </a>
        <a href="#/wavelengths" class="nav-tab" data-view="wavelengths">
          <span class="material-symbols-outlined">waves</span>
          <span class="nav-tab__label">波長</span>
        </a>
        <a href="#/categories" class="nav-tab" data-view="categories">
          <span class="material-symbols-outlined">category</span>
          <span class="nav-tab__label">カテゴリ</span>
        </a>
        <a href="#/parameters" class="nav-tab" data-view="parameters">
          <span class="material-symbols-outlined">tune</span>
          <span class="nav-tab__label">パラメータ</span>
        </a>
        <a href="#/compare" class="nav-tab" data-view="compare">
          <span class="material-symbols-outlined">bubble_chart</span>
          <span class="nav-tab__label">2D比較</span>
        </a>
        <a href="#/graph" class="nav-tab" data-view="graph">
          <span class="material-symbols-outlined">hub</span>
          <span class="nav-tab__label">グラフ</span>
        </a>
      </nav>
    </header>

    <!-- ビューコンテナ: ルーターが各ビューをここに描画 -->
    <div id="viewContainer"></div>

    <!-- ────────── モバイルドック ────────── -->
    <div class="mobile-dock" id="mobileDock">
      <button id="mobileShowFilters" type="button">
        <span class="material-symbols-outlined">tune</span>
        フィルタ
      </button>
      <button id="mobileShowCatalog" type="button" class="active">
        <span class="material-symbols-outlined">grid_view</span>
        一覧
      </button>
    </div>

    <p class="data-disclaimer" id="dataDisclaimer">
      ※掲載スペックは公開情報に基づきます。最新・正確な情報はメーカー公式サイト（一次情報）をご確認ください。
    </p>

    <!-- ────────── 詳細ドロワー ────────── -->
    <div class="detail-overlay" id="detailOverlay" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
      <div class="detail-panel" id="detailPanel">
        <div class="detail-panel__header">
          <div class="detail-panel__title-area">
            <div class="detail-panel__badges" id="detailBadges"></div>
            <h2 class="detail-panel__title" id="detailTitle"></h2>
            <p class="detail-panel__subtitle" id="detailSubtitle"></p>
          </div>
          <button class="icon-button" id="closeDetail" aria-label="閉じる">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="detail-panel__body" id="detailBody"></div>
      </div>
    </div>

    <script src="schema.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
