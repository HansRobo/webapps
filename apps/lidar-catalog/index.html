<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>LiDARカタログ - センサ比較データベース</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XMQZP3GPCC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-XMQZP3GPCC");
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top-app-bar">
      <div class="top-app-bar__content">
        <a href="../../index.html" class="top-app-bar__back" aria-label="ダッシュボードへ戻る">
          <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <span class="material-symbols-outlined top-app-bar__icon">sensors</span>
        <div class="top-app-bar__title-wrap">
          <h1 class="top-app-bar__title">LiDARカタログ</h1>
          <p class="top-app-bar__subtitle">センサ比較データベース（一次情報付き）</p>
        </div>
      </div>
    </header>

    <div class="app-layout">
      <!-- ────────── フィルタパネル ────────── -->
      <aside class="control-panel" id="controlPanel">
        <div class="panel-header">
          <h2>絞り込み</h2>
          <button class="ghost-button" id="clearFiltersButton" type="button">全解除</button>
        </div>

        <div class="quick-search">
          <span class="material-symbols-outlined">search</span>
          <input id="queryInput" type="search" placeholder="製品名・メーカーで検索" autocomplete="off" />
        </div>

        <div class="panel-scroll">
          <section class="filter-block">
            <div class="filter-block__title">カテゴリ</div>
            <div class="chip-group" id="categoryFilterGroup"></div>
          </section>

          <section class="filter-block">
            <div class="filter-block__title">走査方式</div>
            <div class="chip-group" id="scanFilterGroup"></div>
          </section>

          <section class="filter-block">
            <div class="filter-block__title">波長</div>
            <div class="chip-group" id="waveFilterGroup"></div>
          </section>

          <section class="filter-block">
            <div class="filter-block__title">メーカー</div>
            <div class="chip-group" id="manufacturerFilterGroup"></div>
          </section>

          <section class="filter-block">
            <div class="filter-block__title">最大検知距離</div>
            <div class="chip-group" id="rangeFilterGroup"></div>
          </section>

          <div class="filter-block filter-block--checkbox">
            <label class="checkbox-label">
              <input type="checkbox" id="hideDiscontinued" />
              <span>廃番・統合済み製品を除外</span>
            </label>
          </div>
        </div>
      </aside>

      <!-- ────────── カタログメインエリア ────────── -->
      <main class="catalog-stage" id="catalogStage">
        <div class="catalog-header">
          <div class="catalog-stats">
            <span class="count-pill" id="resultCount">0件</span>
            <span class="catalog-stats__total" id="totalCount"></span>
          </div>
          <div class="sort-row">
            <label for="sortSelect">並び替え</label>
            <select id="sortSelect" class="filter-select">
              <option value="default">メーカー順</option>
              <option value="range-desc">最大距離（遠い順）</option>
              <option value="range-asc">最大距離（近い順）</option>
              <option value="name-asc">製品名順</option>
            </select>
          </div>
        </div>

        <div class="active-filters" id="activeFilters"></div>

        <div class="empty-hint" id="emptyHint" hidden>
          条件に一致するLiDARが見つかりません。フィルタを一部解除するか、キーワードを変更してください。
        </div>

        <div class="lidar-grid" id="lidarGrid" role="list"></div>
      </main>
    </div>

    <!-- ────────── モバイルドック ────────── -->
    <div class="mobile-dock" id="mobileDock">
      <button id="mobileShowFilters" type="button">
        <span class="material-symbols-outlined">tune</span>
        フィルタ
      </button>
      <button id="mobileShowCatalog" type="button" class="active">
        <span class="material-symbols-outlined">grid_view</span>
        一覧
      </button>
    </div>

    <p class="data-disclaimer">
      ※掲載スペックは公開情報に基づきます。最新・正確な情報はメーカー公式サイト（一次情報）をご確認ください。
    </p>

    <!-- ────────── 詳細ドロワー ────────── -->
    <div class="detail-overlay" id="detailOverlay" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
      <div class="detail-panel" id="detailPanel">
        <div class="detail-panel__header">
          <div class="detail-panel__title-area">
            <div class="detail-panel__badges" id="detailBadges"></div>
            <h2 class="detail-panel__title" id="detailTitle"></h2>
            <p class="detail-panel__subtitle" id="detailSubtitle"></p>
          </div>
          <button class="icon-button" id="closeDetail" aria-label="閉じる">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="detail-panel__body" id="detailBody"></div>
      </div>
    </div>

    <script src="schema.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
